[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-sentinel"
version = "0.2.0"
description = "A deterministic CLI pipeline for OSS issue health analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "PyGithub==2.8.1",
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.3",
  "requests==2.33.1",
  "seaborn==0.13.2",
]

[project.optional-dependencies]
provider = ["openai==2.14.0"]
dev = [
  "mypy==1.15.0",
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "ruff==0.9.10",
  "types-PyYAML==6.0.12.20250915",
  "types-requests==2.32.4.20260107",
]

[project.scripts]
oss-sentinel = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = false
